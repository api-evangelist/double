name: Double
description: 'Double is a New York-based future-of-work company that pairs busy executives
  and founders with highly vetted, US-based remote executive assistants, augmented by
  an AI copilot (Mingo) that helps assistants summarize tasks, draft communications,
  prompt follow-up questions, and report time. Founded in 2018 by the former Sunrise
  Calendar team (Alice Default, Christophe Lamperti, Pierre-Elie Fauche), Double delivers
  operations, marketing, scheduling, inbox, and administrative delegation through a
  managed platform and shared secure workflows built around a per-client 1Password vault.
  Double is not a public API provider; this API Evangelist profile tracks the company''s
  public web properties and domain security posture.'
